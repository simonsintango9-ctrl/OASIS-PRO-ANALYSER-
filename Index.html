<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OASIS-PRO-ANALYSER</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-rose-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ======================================================
    // 1. CONFIGURATION (PERSONAL APP ID)
    // ======================================================

    const WS_BASE_URL = "wss://ws.derivws.com/websockets/v3";

    const STORAGE_KEYS = {
      appId: "personal_deriv_app_id_v1",
      apiToken: "personal_deriv_api_token_v1"
    };

    const ASSETS = [
      { symbol: "R_10", name: "Volatility 10", decimals: 3 },
      { symbol: "R_25", name: "Volatility 25", decimals: 3 },
      { symbol: "R_50", name: "Volatility 50", decimals: 4 },
      { symbol: "R_75", name: "Volatility 75", decimals: 4 },
      { symbol: "R_100", name: "Volatility 100", decimals: 2 },
      { symbol: "1HZ10V", name: "Volatility 10 (1s)", decimals: 2 },
      { symbol: "1HZ25V", name: "Volatility 25 (1s)", decimals: 2 },
      { symbol: "1HZ50V", name: "Volatility 50 (1s)", decimals: 2 },
      { symbol: "1HZ75V", name: "Volatility 75 (1s)", decimals: 2 },
      { symbol: "1HZ100V", name: "Volatility 100 (1s)", decimals: 2 },
      { symbol: "JD10", name: "Jump 10", decimals: 2 },
      { symbol: "JD25", name: "Jump 25", decimals: 2 }
    ];

    const SCAN_SAMPLE_SIZE = 250;
    const MAX_TICKS = 10000;
    const MIN_ANALYSIS_TICKS = 100;

    function loadSavedValue(key, fallback = "") {
      try {
        const val = window.localStorage.getItem(key);
        return val !== null ? val : fallback;
      } catch {
        return fallback;
      }
    }

    function saveValue(key, value) {
      try {
        if (value.trim()) {
          window.localStorage.setItem(key, value.trim());
        } else {
          window.localStorage.removeItem(key);
        }
      } catch {
        // Ignore storage errors
      }
    }

    // ======================================================
    // 2. PRICE PRECISION AND DIGIT EXTRACTION
    // ======================================================

    function formatQuote(quote, pipSize) {
      return Number(quote).toFixed(pipSize);
    }

    function makeTick(quote, epoch, pipSize) {
      const price = Number(quote);
      const ts = Number(epoch);

      if (!Number.isFinite(price) || !Number.isFinite(ts)) {
        return null;
      }

      const safePip = Number.isInteger(pipSize) && pipSize >= 0 ? pipSize : 2;
      const formatted = formatQuote(price, safePip);

      return {
        price,
        formatted,
        digit: Number(formatted.at(-1)),
        epoch: ts * 1000
      };
    }

    // ======================================================
    // 3. STATISTICAL UTILITIES
    // ======================================================

    function getDigitCounts(ticks) {
      const counts = Array(10).fill(0);
      ticks.forEach(tick => {
        if (Number.isInteger(tick.digit) && tick.digit >= 0 && tick.digit <= 9) {
          counts[tick.digit]++;
        }
      });
      return counts;
    }

    function getFrequencies(ticks) {
      const counts = getDigitCounts(ticks);
      const total = ticks.length;
      return counts.map((count, digit) => ({
        digit,
        count,
        pct: total ? (count / total) * 100 : 0
      }));
    }

    function calculateChiSquare(ticks) {
      if (!ticks.length) return null;
      const counts = getDigitCounts(ticks);
      const expected = ticks.length / 10;
      return counts.reduce(
        (sum, observed) => sum + Math.pow(observed - expected, 2) / expected,
        0
      );
    }

    function calculateEntropy(probabilities) {
      return -probabilities.reduce((sum, p) => {
        if (p <= 0) return sum;
        const probability = p / 100;
        return sum + probability * Math.log2(probability);
      }, 0);
    }

    function summarizeMarketTicks(assetObj, ticks) {
      const frequencies = getFrequencies(ticks);
      const entropy = calculateEntropy(frequencies.map(f => f.pct));
      const chiSquare = calculateChiSquare(ticks) ?? 0;

      const sortedByPct = [...frequencies].sort((a, b) => b.pct - a.pct);
      const topDigit = sortedByPct[0];
      const bottomDigit = sortedByPct.at(-1);
      const spreadPct = topDigit && bottomDigit ? topDigit.pct - bottomDigit.pct : 0;

      return {
        symbol: assetObj.symbol,
        name: assetObj.name,
        ticksCount: ticks.length,
        entropy,
        chiSquare,
        topDigit: topDigit?.digit ?? null,
        topPct: topDigit?.pct ?? 0,
        spreadPct,
        lastPrice: ticks.at(-1)?.formatted ?? "--",
        lastDigit: ticks.at(-1)?.digit ?? null,
        updatedAt: Date.now()
      };
    }

    // ======================================================
    // 4. MARKOV TRANSITION ANALYSIS
    // ======================================================

    function calculateMarkov(ticks, horizon = 1, alpha = 1) {
      const digits = ticks.map(t => t.digit);

      if (digits.length <= horizon) {
        return {
          probabilities: Array(10).fill(10),
          observations: 0,
          currentDigit: digits.at(-1) ?? null
        };
      }

      const currentDigit = digits.at(-1);
      const counts = Array(10).fill(0);
      let observations = 0;

      for (let i = 0; i < digits.length - horizon; i++) {
        if (digits[i] === currentDigit) {
          counts[digits[i + horizon]]++;
          observations++;
        }
      }

      const denominator = observations + 10 * alpha;
      const probabilities = counts.map(count => ((count + alpha) / denominator) * 100);

      return {
        probabilities,
        observations,
        currentDigit
      };
    }

    // ======================================================
    // 5. QUANTITATIVE ANALYSIS ENGINE
    // ======================================================

    function runAnalysis({ ticks, duration, contractType, subMode, barrier }) {
      if (ticks.length < MIN_ANALYSIS_TICKS) {
        return { error: `At least ${MIN_ANALYSIS_TICKS} real ticks are required.` };
      }

      const recent = ticks.slice(-100);
      const global = getFrequencies(ticks);
      const recentFreq = getFrequencies(recent);
      const markov = calculateMarkov(ticks, duration);

      const scores = global.map((item, i) => ({
        digit: item.digit,
        globalPct: item.pct,
        recentPct: recentFreq[i].pct,
        markovPct: markov.probabilities[i],
        score: item.pct * 0.2 + recentFreq[i].pct * 0.3 + markov.probabilities[i] * 0.5
      }));

      const scoreTotal = scores.reduce((s, x) => s + x.score, 0);
      const normalized = scores.map(x => ({
        ...x,
        probability: scoreTotal > 0 ? (x.score / scoreTotal) * 100 : 10
      }));

      const sorted = [...normalized].sort((a, b) => b.probability - a.probability);
      const highest = sorted[0];

      let primaryDisplay = "";
      let headline = "";
      let probability = 0;
      let recommendedParam = "";
      let badgeLabel = "";

      if (contractType === "matches_differs") {
        if (subMode === "MATCHES") {
          primaryDisplay = String(highest.digit);
          probability = highest.probability;
          badgeLabel = "MATCHES";
          headline = `Most favoured digit: ${highest.digit}`;
          recommendedParam = `Matches ${highest.digit}`;
        } else {
          primaryDisplay = String(highest.digit);
          probability = 100 - highest.probability;
          badgeLabel = "DIFFERS";
          headline = `Differ from the most likely digit: ${highest.digit}`;
          recommendedParam = `Differs ${highest.digit}`;
        }
      }

      if (contractType === "even_odd") {
        const evenProbability = normalized
          .filter(x => x.digit % 2 === 0)
          .reduce((sum, x) => sum + x.probability, 0);
        const oddProbability = 100 - evenProbability;
        const even = subMode === "EVEN";

        primaryDisplay = even ? "EVEN" : "ODD";
        probability = even ? evenProbability : oddProbability;
        badgeLabel = "PARITY";
        headline = `${even ? "Even" : "Odd"} probability estimate`;
        recommendedParam = even ? "Even" : "Odd";
      }

      if (contractType === "over_under") {
        const isOver = subMode === "OVER";
        const selected = normalized.filter(x =>
          isOver ? x.digit > barrier : x.digit < barrier
        );
        probability = selected.reduce((sum, x) => sum + x.probability, 0);
        primaryDisplay = `${isOver ? "OVER" : "UNDER"} ${barrier}`;
        badgeLabel = "RANGE";
        headline = `${primaryDisplay} probability estimate`;
        recommendedParam = primaryDisplay;
      }

      if (contractType === "rise_fall") {
        const prices = ticks.map(t => t.price);
        const fast = prices.slice(-6);
        const slow = prices.slice(-24);
        const fastMean = fast.reduce((a, b) => a + b, 0) / fast.length;
        const slowMean = slow.reduce((a, b) => a + b, 0) / slow.length;
        const isRise = fastMean >= slowMean;

        primaryDisplay = isRise ? "RISE" : "FALL";
        badgeLabel = "DIRECTION";
        headline = "Moving-average direction indicator";
        recommendedParam = primaryDisplay;
        probability = null;
      }

      const frequencies = global;
      const chiSquare = calculateChiSquare(ticks);
      const entropy = calculateEntropy(frequencies.map(x => x.pct));

      return {
        primaryDisplay,
        headline,
        badgeLabel,
        probability,
        recommendedParam,
        frequencies,
        chiSquare,
        entropy,
        sampleSize: ticks.length,
        recentSize: recent.length,
        transitionObservations: markov.observations,
        currentDigit: markov.currentDigit,
        sorted,
        markovProbabilities: markov.probabilities
      };
    }

    // ======================================================
    // 6. MAIN APPLICATION
    // ======================================================

    function App() {
      const [appId, setAppId] = useState(() => loadSavedValue(STORAGE_KEYS.appId, ""));
      const [apiToken, setApiToken] = useState(() => loadSavedValue(STORAGE_KEYS.apiToken, ""));
      const [authStatus, setAuthStatus] = useState("NONE");

      const [selectedSymbol, setSelectedSymbol] = useState("R_100");
      const [status, setStatus] = useState("DISCONNECTED");
      const [error, setError] = useState("");
      const [ticks, setTicks] = useState([]);
      const [pipSize, setPipSize] = useState(2);
      const [latency, setLatency] = useState(null);

      const [duration, setDuration] = useState(1);
      const [contractType, setContractType] = useState("matches_differs");
      const [subMode, setSubMode] = useState("MATCHES");
      const [barrier, setBarrier] = useState(4);

      const [result, setResult] = useState(null);
      const [windowSize, setWindowSize] = useState(1000);
      const [copied, setCopied] = useState(false);

      const [showCredentialsPanel, setShowCredentialsPanel] = useState(
        () => !loadSavedValue(STORAGE_KEYS.appId, "").trim()
      );

      const [scanRankMetric, setScanRankMetric] = useState("chiSquare");
      const [isScanningMarkets, setIsScanningMarkets] = useState(false);
      const [scanProgress, setScanProgress] = useState({
        current: 0,
        total: ASSETS.length,
        symbol: ""
      });
      const [scanRowsBySymbol, setScanRowsBySymbol] = useState({});
      const [scanError, setScanError] = useState("");

      const [liveTrackEnabled, setLiveTrackEnabled] = useState(false);
      const [liveTrackStatus, setLiveTrackStatus] = useState("IDLE");
      const [autoRefreshSec, setAutoRefreshSec] = useState(0);
      const [liveTickCount, setLiveTickCount] = useState(0);

      const [isProcessingAnalysis, setIsProcessingAnalysis] = useState(false);
      const [analysisProgress, setAnalysisProgress] = useState(0);

      const wsRef = useRef(null);
      const subscriptionRef = useRef(null);
      const requestTimeRef = useRef(null);
      const activeRef = useRef(false);
      const connectionIdRef = useRef(0);
      const analysisTimerRef = useRef(null);
      const pipSizeRef = useRef(2);
      const assetDecimalsRef = useRef(2);

      const scanWsRef = useRef(null);
      const scanSubscriptionsRef = useRef(new Map());
      const scanTicksMapRef = useRef(new Map());
      const scanPipMapRef = useRef(new Map());
      const pendingScanResolversRef = useRef(new Map());
      const scanAbortRef = useRef(false);

      const asset = useMemo(
        () => ASSETS.find(a => a.symbol === selectedSymbol) || ASSETS[0],
        [selectedSymbol]
      );

      useEffect(() => {
        assetDecimalsRef.current = asset.decimals;
      }, [asset.decimals]);

      useEffect(() => {
        pipSizeRef.current = pipSize;
      }, [pipSize]);

      const latestTick = ticks.at(-1);

      const stopLiveScannerStream = useCallback(() => {
        const sws = scanWsRef.current;
        scanWsRef.current = null;

        if (sws && sws.readyState === WebSocket.OPEN) {
          scanSubscriptionsRef.current.forEach(subId => {
            if (subId) sws.send(JSON.stringify({ forget: subId }));
          });
          sws.close();
        }

        scanSubscriptionsRef.current.clear();
        setLiveTrackStatus("IDLE");
      }, []);

      useEffect(() => {
        return () => {
          scanAbortRef.current = true;
          stopLiveScannerStream();
          pendingScanResolversRef.current.forEach(({ reject, timer }) => {
            clearTimeout(timer);
            reject(new Error("Unmounted"));
          });
          pendingScanResolversRef.current.clear();
          if (analysisTimerRef.current) clearInterval(analysisTimerRef.current);
        };
      }, [stopLiveScannerStream]);

      const disconnect = useCallback(() => {
        activeRef.current = false;
        connectionIdRef.current++;

        if (wsRef.current) {
          const ws = wsRef.current;
          wsRef.current = null;
          if (ws.readyState === WebSocket.OPEN) {
            if (subscriptionRef.current) {
              ws.send(JSON.stringify({ forget: subscriptionRef.current }));
            }
            ws.close();
          }
        }

        subscriptionRef.current = null;
        setStatus("DISCONNECTED");
      }, []);

      const connectWithCredentials = useCallback(
        (rawAppId, rawToken, symbolToSub, countToSub) => {
          disconnect();

          const id = connectionIdRef.current;
          const cleanAppId = (rawAppId ?? appId).trim();
          const cleanToken = (rawToken ?? apiToken).trim();

          if (!/^\d+$/.test(cleanAppId)) {
            setShowCredentialsPanel(true);
            setError("Enter your personal numeric Deriv App ID first to connect.");
            return;
          }

          saveValue(STORAGE_KEYS.appId, cleanAppId);
          saveValue(STORAGE_KEYS.apiToken, cleanToken);

          setError("");
          setAuthStatus("NONE");
          setTicks([]);
          setResult(null);
          setStatus("CONNECTING");
          activeRef.current = true;

          let ws;
          try {
            ws = new WebSocket(`${WS_BASE_URL}?app_id=${encodeURIComponent(cleanAppId)}`);
          } catch (err) {
            setStatus("DISCONNECTED");
            setError(err.message || "Unable to create WebSocket.");
            return;
          }

          wsRef.current = ws;

          ws.onopen = () => {
            if (!activeRef.current || id !== connectionIdRef.current) {
              ws.close();
              return;
            }

            setStatus("LIVE");

            if (cleanToken) {
              ws.send(JSON.stringify({ authorize: cleanToken, req_id: "auth_main" }));
            }

            ws.send(
              JSON.stringify({
                ticks_history: symbolToSub,
                count: countToSub,
                end: "latest",
                style: "ticks",
                subscribe: 1,
                req_id: "stream_main"
              })
            );

            requestTimeRef.current = performance.now();
          };

          ws.onmessage = event => {
            if (!activeRef.current || id !== connectionIdRef.current) return;

            try {
              const data = JSON.parse(event.data);

              if (data.error) {
                if (data.msg_type === "authorize") setAuthStatus("FAILED");
                setError(`${data.error.code || "API_ERROR"}: ${data.error.message}`);
                setStatus("ERROR");
                return;
              }

              if (data.msg_type === "authorize" && data.authorize) {
                setAuthStatus("AUTHORIZED");
              }

              if (data.msg_type === "history" && data.history) {
                const precision = Number.isInteger(data.pip_size)
                  ? data.pip_size
                  : assetDecimalsRef.current;

                setPipSize(precision);
                pipSizeRef.current = precision;

                const historyTicks = data.history.prices
                  .map((price, index) => makeTick(price, data.history.times[index], precision))
                  .filter(Boolean);

                setTicks(historyTicks.slice(-MAX_TICKS));

                if (data.subscription?.id) {
                  subscriptionRef.current = data.subscription.id;
                }
              }

              if (data.msg_type === "tick" && data.tick) {
                const precision = Number.isInteger(data.tick.pip_size)
                  ? data.tick.pip_size
                  : pipSizeRef.current;

                setPipSize(precision);
                pipSizeRef.current = precision;

                const tick = makeTick(data.tick.quote, data.tick.epoch, precision);
                if (!tick) return;

                if (requestTimeRef.current !== null) {
                  setLatency(Math.round(performance.now() - requestTimeRef.current));
                  requestTimeRef.current = null;
                }

                if (data.subscription?.id) {
                  subscriptionRef.current = data.subscription.id;
                }

                setTicks(previous => {
                  const last = previous.at(-1);
                  if (last && last.epoch === tick.epoch) return previous;
                  return [...previous, tick].slice(-MAX_TICKS);
                });
              }
            } catch (err) {
              setError(`Message processing error: ${err.message}`);
            }
          };

          ws.onerror = () => {
            if (id === connectionIdRef.current) {
              setError("WebSocket network error. Check your App ID and connection.");
            }
          };

          ws.onclose = () => {
            if (id === connectionIdRef.current) {
              setStatus("DISCONNECTED");
              subscriptionRef.current = null;
            }
          };
        },
        [appId, apiToken, disconnect]
      );

      useEffect(() => {
        if (!appId.trim()) return;
        connectWithCredentials(appId, apiToken, selectedSymbol, windowSize);
        return () => disconnect();
      }, [selectedSymbol, windowSize]);

      const handleScannerLiveMessage = useCallback(event => {
        try {
          const data = JSON.parse(event.data);

          if (
            typeof data.req_id === "string" &&
            pendingScanResolversRef.current.has(data.req_id)
          ) {
            const pending = pendingScanResolversRef.current.get(data.req_id);
            pendingScanResolversRef.current.delete(data.req_id);
            clearTimeout(pending.timer);
            if (data.error) {
              pending.reject(new Error(data.error.message || "Scan history error"));
            } else {
              pending.resolve(data);
            }
            return;
          }

          if (data.error) return;

          if (
            data.msg_type === "history" &&
            typeof data.req_id === "string" &&
            data.req_id.startsWith("live_seed_")
          ) {
            const symbol = data.req_id.replace("live_seed_", "");
            const assetObj = ASSETS.find(a => a.symbol === symbol);
            if (!assetObj) return;

            const precision = Number.isInteger(data.pip_size)
              ? data.pip_size
              : assetObj.decimals;
            scanPipMapRef.current.set(symbol, precision);

            if (data.subscription?.id) {
              scanSubscriptionsRef.current.set(symbol, data.subscription.id);
            }

            const seeded = (data.history?.prices || [])
              .map((price, idx) => makeTick(price, data.history.times?.[idx], precision))
              .filter(Boolean)
              .slice(-SCAN_SAMPLE_SIZE);

            scanTicksMapRef.current.set(symbol, seeded);

            if (seeded.length >= 20) {
              setScanRowsBySymbol(prev => ({
                ...prev,
                [symbol]: summarizeMarketTicks(assetObj, seeded)
              }));
            }
          }

          if (data.msg_type === "tick" && data.tick) {
            const symbol = data.tick.symbol;
            const assetObj = ASSETS.find(a => a.symbol === symbol);
            if (!assetObj) return;

            if (data.subscription?.id) {
              scanSubscriptionsRef.current.set(symbol, data.subscription.id);
            }

            const precision = Number.isInteger(data.tick.pip_size)
              ? data.tick.pip_size
              : scanPipMapRef.current.get(symbol) ?? assetObj.decimals;
            scanPipMapRef.current.set(symbol, precision);

            const newTick = makeTick(data.tick.quote, data.tick.epoch, precision);
            if (!newTick) return;

            const existing = scanTicksMapRef.current.get(symbol) || [];
            const last = existing.at(-1);
            if (last && last.epoch === newTick.epoch) return;

            const nextBuffer = [...existing, newTick].slice(-SCAN_SAMPLE_SIZE);
            scanTicksMapRef.current.set(symbol, nextBuffer);
            setLiveTickCount(c => c + 1);

            if (nextBuffer.length >= 20) {
              setScanRowsBySymbol(prev => ({
                ...prev,
                [symbol]: summarizeMarketTicks(assetObj, nextBuffer)
              }));
            }
          }
        } catch {
          // Ignore malformed frames
        }
      }, []);

      const startLiveScannerStream = useCallback(async () => {
        const cleanAppId = appId.trim();
        if (!/^\d+$/.test(cleanAppId)) {
          setShowCredentialsPanel(true);
          setScanError("Enter a valid personal numeric App ID for live tracking.");
          setLiveTrackEnabled(false);
          return;
        }

        stopLiveScannerStream();
        setScanError("");
        setLiveTrackStatus("CONNECTING");

        try {
          const socket = await new Promise((resolve, reject) => {
            const ws = new WebSocket(`${WS_BASE_URL}?app_id=${encodeURIComponent(cleanAppId)}`);
            const timer = setTimeout(() => {
              ws.close();
              reject(new Error("Live scanner connection timed out."));
            }, 7000);
            ws.onopen = () => {
              clearTimeout(timer);
              resolve(ws);
            };
            ws.onerror = () => {
              clearTimeout(timer);
              reject(new Error("Failed to open live scanner WebSocket."));
            };
          });

          scanWsRef.current = socket;
          socket.onmessage = handleScannerLiveMessage;
          socket.onclose = () => {
            if (scanWsRef.current === socket) {
              scanWsRef.current = null;
              setLiveTrackStatus("IDLE");
            }
          };

          setLiveTrackStatus("STREAMING");

          ASSETS.forEach((a, idx) => {
            setTimeout(() => {
              if (socket.readyState === WebSocket.OPEN) {
                socket.send(
                  JSON.stringify({
                    ticks_history: a.symbol,
                    count: SCAN_SAMPLE_SIZE,
                    end: "latest",
                    style: "ticks",
                    subscribe: 1,
                    req_id: `live_seed_${a.symbol}`
                  })
                );
              }
            }, idx * 70);
          });
        } catch (err) {
          setScanError(err.message);
          setLiveTrackStatus("IDLE");
          setLiveTrackEnabled(false);
        }
      }, [appId, handleScannerLiveMessage, stopLiveScannerStream]);

      useEffect(() => {
        if (liveTrackEnabled) {
          startLiveScannerStream();
        } else {
          stopLiveScannerStream();
        }
        return () => stopLiveScannerStream();
      }, [liveTrackEnabled, startLiveScannerStream, stopLiveScannerStream]);

      const fetchMarketHistorySnapshot = useCallback((targetAsset, reqId, socketOverride) => {
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            pendingScanResolversRef.current.delete(reqId);
            reject(new Error(`Timeout fetching ${targetAsset.symbol}`));
          }, 7000);

          const payload = JSON.stringify({
            ticks_history: targetAsset.symbol,
            count: SCAN_SAMPLE_SIZE,
            end: "latest",
            style: "ticks",
            req_id: reqId
          });

          const targetSocket =
            socketOverride ||
            (scanWsRef.current && scanWsRef.current.readyState === WebSocket.OPEN
              ? scanWsRef.current
              : null);

          if (targetSocket) {
            const onMsg = event => {
              try {
                const data = JSON.parse(event.data);
                if (data.req_id !== reqId) return;
                targetSocket.removeEventListener("message", onMsg);
                clearTimeout(timer);
                if (data.error) {
                  reject(new Error(data.error.message || "API error"));
                } else {
                  resolve(data);
                }
              } catch (e) {
                reject(e);
              }
            };
            targetSocket.addEventListener("message", onMsg);
            targetSocket.send(payload);
            return;
          }

          clearTimeout(timer);
          reject(new Error("No scanner socket available"));
        });
      }, []);

      const runLiveMarketScan = useCallback(
        async (autoSelectBest = false, silentRefresh = false) => {
          if (isScanningMarkets) return;

          const cleanAppId = appId.trim();
          if (!/^\d+$/.test(cleanAppId)) {
            if (!silentRefresh) {
              setShowCredentialsPanel(true);
              setScanError("Enter a valid personal numeric App ID before scanning.");
            }
            return;
          }

          scanAbortRef.current = false;
          if (!silentRefresh) {
            setScanError("");
            setIsScanningMarkets(true);
            setScanProgress({ current: 0, total: ASSETS.length, symbol: ASSETS[0].symbol });
          }

          let tempSocket = null;
          const hasLiveScanSocket =
            scanWsRef.current && scanWsRef.current.readyState === WebSocket.OPEN;

          if (!hasLiveScanSocket) {
            try {
              tempSocket = await new Promise((resolve, reject) => {
                const socket = new WebSocket(`${WS_BASE_URL}?app_id=${encodeURIComponent(cleanAppId)}`);
                const t = setTimeout(() => {
                  socket.close();
                  reject(new Error("Connection timed out while scanning."));
                }, 7000);
                socket.onopen = () => {
                  clearTimeout(t);
                  resolve(socket);
                };
                socket.onerror = () => {
                  clearTimeout(t);
                  reject(new Error("Failed to open WebSocket for scan."));
                };
              });
            } catch (err) {
              if (!silentRefresh) {
                setIsScanningMarkets(false);
                setScanError(err.message);
              }
              return;
            }
          }

          const batchUpdates = {};

          for (let i = 0; i < ASSETS.length; i++) {
            if (scanAbortRef.current) break;
            const currentAsset = ASSETS[i];
            if (!silentRefresh) {
              setScanProgress({
                current: i + 1,
                total: ASSETS.length,
                symbol: currentAsset.symbol
              });
            }

            try {
              const response = await fetchMarketHistorySnapshot(
                currentAsset,
                `snap_${i}_${Date.now()}`,
                tempSocket
              );

              const precision = Number.isInteger(response.pip_size)
                ? response.pip_size
                : currentAsset.decimals;

              const parsedTicks = (response.history?.prices || [])
                .map((price, idx) => makeTick(price, response.history.times?.[idx], precision))
                .filter(Boolean);

              if (parsedTicks.length >= 20) {
                scanTicksMapRef.current.set(
                  currentAsset.symbol,
                  parsedTicks.slice(-SCAN_SAMPLE_SIZE)
                );
                batchUpdates[currentAsset.symbol] = summarizeMarketTicks(currentAsset, parsedTicks);
              } else {
                batchUpdates[currentAsset.symbol] = {
                  symbol: currentAsset.symbol,
                  name: currentAsset.name,
                  ticksCount: parsedTicks.length,
                  entropy: null,
                  chiSquare: null,
                  error: "Insufficient ticks"
                };
              }
            } catch (err) {
              batchUpdates[currentAsset.symbol] = {
                symbol: currentAsset.symbol,
                name: currentAsset.name,
                ticksCount: 0,
                entropy: null,
                chiSquare: null,
                error: err.message
              };
            }

            await new Promise(r => setTimeout(r, 110));
          }

          if (tempSocket && tempSocket.readyState === WebSocket.OPEN) {
            tempSocket.close();
          }

          setScanRowsBySymbol(prev => ({ ...prev, ...batchUpdates }));
          if (!silentRefresh) setIsScanningMarkets(false);

          if (autoSelectBest) {
            const valid = Object.values(batchUpdates).filter(
              r => !r.error && r.chiSquare !== null
            );
            valid.sort((a, b) =>
              scanRankMetric === "entropy" ? b.entropy - a.entropy : b.chiSquare - a.chiSquare
            );
            if (valid[0]) {
              setSelectedSymbol(valid[0].symbol);
              setResult(null);
            }
          }
        },
        [appId, fetchMarketHistorySnapshot, isScanningMarkets, scanRankMetric]
      );

      useEffect(() => {
        if (!autoRefreshSec || !appId.trim()) return;
        const interval = setInterval(() => {
          if (!isScanningMarkets) runLiveMarketScan(false, true);
        }, autoRefreshSec * 1000);
        return () => clearInterval(interval);
      }, [autoRefreshSec, appId, isScanningMarkets, runLiveMarketScan]);

      const rankedScanResults = useMemo(() => {
        const allRows = Object.values(scanRowsBySymbol);
        if (!allRows.length) return [];
        const valid = allRows.filter(r => !r.error && r.chiSquare !== null);
        const invalid = allRows.filter(r => r.error || r.chiSquare === null);
        valid.sort((a, b) =>
          scanRankMetric === "entropy" ? b.entropy - a.entropy : b.chiSquare - a.chiSquare
        );
        return [...valid, ...invalid];
      }, [scanRowsBySymbol, scanRankMetric]);

      const executeAnalysis = () => {
        if (status !== "LIVE") {
          setError("Connect with your personal App ID before running analysis.");
          return;
        }
        if (ticks.length < MIN_ANALYSIS_TICKS) {
          setError(`Collect at least ${MIN_ANALYSIS_TICKS} real ticks first.`);
          return;
        }
        if (analysisTimerRef.current) clearInterval(analysisTimerRef.current);

        setIsProcessingAnalysis(true);
        setAnalysisProgress(18);

        let progress = 18;
        analysisTimerRef.current = setInterval(() => {
          progress += 28;
          if (progress >= 100) {
            clearInterval(analysisTimerRef.current);
            setAnalysisProgress(100);
            const analysis = runAnalysis({
              ticks: ticks.slice(-windowSize),
              duration,
              contractType,
              subMode,
              barrier
            });
            setResult(analysis);
            setIsProcessingAnalysis(false);
            setError(analysis.error || "");
          } else {
            setAnalysisProgress(progress);
          }
        }, 110);
      };

      const copyResult = async () => {
        if (!result || result.error) return;
        const text = [
          "Personal Deriv Tick Analyzer",
          `Market: ${asset.name} (${asset.symbol})`,
          `Signal: ${result.primaryDisplay}`,
          `Type: ${result.badgeLabel}`,
          `Estimated probability: ${
            result.probability === null ? "Not calculated" : result.probability.toFixed(2) + "%"
          }`,
          `Samples: ${result.sampleSize}`,
          `Chi-square: ${result.chiSquare.toFixed(3)}`
        ].join("\n");

        try {
          await navigator.clipboard.writeText(text);
          setCopied(true);
          setTimeout(() => setCopied(false), 1800);
        } catch {
          setError("Clipboard access failed.");
        }
      };

      const lastDigits = ticks.slice(-10);
      const formattedPrefix = latestTick ? latestTick.formatted.slice(0, -1) : "--.";
      const formattedFinalDigit = latestTick ? latestTick.formatted.slice(-1) : "-";

      return (
        <div className="min-h-screen pb-12">
          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200">
            <div className="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="font-extrabold text-base sm:text-lg tracking-tight text-slate-900">
                    Personal Tick Analyzer
                  </h1>
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">
                    PERSONAL APP ID
                  </span>
                </div>
                <p className="text-[11px] text-slate-500">
                  Local Credentials • Live Multi-Market Scanner
                </p>
              </div>

              <div className="flex items-center gap-2">
                <span
                  className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold border ${
                    status === "LIVE"
                      ? "bg-emerald-50 text-emerald-700 border-emerald-200"
                      : status === "CONNECTING"
                      ? "bg-amber-50 text-amber-700 border-amber-200"
                      : "bg-rose-50 text-rose-700 border-rose-200"
                  }`}
                >
                  <span
                    className={`w-2 h-2 rounded-full ${
                      status === "LIVE" ? "bg-emerald-500 animate-pulse" : "bg-rose-500"
                    }`}
                  />
                  {status}
                </span>

                <button
                  type="button"
                  onClick={() => setShowCredentialsPanel(p => !p)}
                  className="px-3 py-1.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-xs font-bold text-slate-700 cursor-pointer"
                >
                  App ID
                </button>
              </div>
            </div>

            {showCredentialsPanel && (
              <div className="border-t border-slate-100 bg-slate-50 px-4 py-3.5">
                <div className="max-w-2xl mx-auto space-y-3">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <div>
                      <label className="block text-[11px] font-bold uppercase text-slate-600 mb-1">
                        Personal Deriv App ID (Required)
                      </label>
                      <input
                        type="text"
                        inputMode="numeric"
                        value={appId}
                        onChange={e => setAppId(e.target.value)}
                        placeholder="Enter your numeric App ID"
                        className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm font-mono font-semibold outline-none focus:border-emerald-500"
                      />
                    </div>
                    <div>
                      <label className="flex items-center justify-between text-[11px] font-bold uppercase text-slate-600 mb-1">
                        <span>Personal API Token (Optional)</span>
                        {authStatus === "AUTHORIZED" && (
                          <span className="text-emerald-700">AUTH OK</span>
                        )}
                      </label>
                      <input
                        type="password"
                        autoComplete="off"
                        value={apiToken}
                        onChange={e => setApiToken(e.target.value)}
                        placeholder="Optional Deriv API token"
                        className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm font-mono font-semibold outline-none focus:border-emerald-500"
                      />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2">
                    {(appId || apiToken) && (
                      <button
                        type="button"
                        onClick={() => {
                          disconnect();
                          stopLiveScannerStream();
                          setLiveTrackEnabled(false);
                          setAppId("");
                          setApiToken("");
                          saveValue(STORAGE_KEYS.appId, "");
                          saveValue(STORAGE_KEYS.apiToken, "");
                        }}
                        className="px-3 py-2 rounded-xl bg-white text-rose-600 border border-rose-200 text-xs font-bold cursor-pointer"
                      >
                        Clear
                      </button>
                    )}
                    <button
                      type="button"
                      onClick={() =>
                        connectWithCredentials(appId, apiToken, selectedSymbol, windowSize)
                      }
                      className="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold cursor-pointer"
                    >
                      Save &amp; Connect
                    </button>
                  </div>
                </div>
              </div>
            )}
          </header>

          <main className="max-w-2xl mx-auto px-3 sm:px-4 pt-4 space-y-4">
            {error && (
              <div className="bg-rose-50 border border-rose-200 text-rose-800 rounded-2xl p-3.5 text-xs sm:text-sm font-medium">
                {error}
              </div>
            )}

            {/* MULTI-MARKET SCANNER */}
            <section className="bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 shadow-xs space-y-4">
              <div className="flex items-center justify-between gap-2">
                <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-700">
                  Live Multi-Market Scanner ({SCAN_SAMPLE_SIZE} Ticks / Asset)
                </h2>
                <span className="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-600 border border-rose-200">
                  {liveTrackStatus === "STREAMING" ? "LIVE TRACKING" : "REAL TICK QUERY"}
                </span>
              </div>

              <div className="flex flex-wrap items-center justify-between gap-2">
                <span className="text-[11px] font-bold uppercase text-slate-500">Rank By:</span>
                <div className="inline-flex rounded-xl bg-slate-100 p-1 border border-slate-200">
                  <button
                    type="button"
                    onClick={() => setScanRankMetric("chiSquare")}
                    className={`px-3 py-1 rounded-lg text-xs font-extrabold cursor-pointer ${
                      scanRankMetric === "chiSquare" ? "bg-slate-900 text-white" : "text-slate-600"
                    }`}
                  >
                    Chi-Square
                  </button>
                  <button
                    type="button"
                    onClick={() => setScanRankMetric("entropy")}
                    className={`px-3 py-1 rounded-lg text-xs font-extrabold cursor-pointer ${
                      scanRankMetric === "entropy" ? "bg-slate-900 text-white" : "text-slate-600"
                    }`}
                  >
                    Entropy
                  </button>
                </div>
              </div>

              <div className="rounded-xl bg-slate-50 border border-slate-200 p-3 flex flex-wrap items-center justify-between gap-2">
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={() => setLiveTrackEnabled(p => !p)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-extrabold border cursor-pointer ${
                      liveTrackEnabled
                        ? "bg-emerald-600 text-white border-emerald-600"
                        : "bg-white text-slate-700 border-slate-300"
                    }`}
                  >
                    {liveTrackEnabled ? "Stop Live Ticks" : "Live Track Ticks"}
                  </button>
                  {liveTrackEnabled && (
                    <span className="text-[11px] font-mono font-bold text-emerald-700">
                      {liveTrackStatus === "CONNECTING"
                        ? "Connecting..."
                        : `${liveTickCount.toLocaleString()} live ticks`}
                    </span>
                  )}
                </div>

                <div className="flex items-center gap-1.5">
                  <span className="text-[10px] font-bold uppercase text-slate-500">Refresh:</span>
                  {[
                    { label: "Off", sec: 0 },
                    { label: "10s", sec: 10 },
                    { label: "30s", sec: 30 }
                  ].map(opt => (
                    <button
                      key={opt.sec}
                      type="button"
                      onClick={() => setAutoRefreshSec(opt.sec)}
                      className={`px-2 py-1 rounded-md text-[11px] font-bold border cursor-pointer ${
                        autoRefreshSec === opt.sec
                          ? "bg-slate-900 text-white border-slate-900"
                          : "bg-white text-slate-600 border-slate-200"
                      }`}
                    >
                      {opt.label}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-[11px] font-bold uppercase text-slate-500 mb-1">
                  Active Market
                </label>
                <select
                  value={selectedSymbol}
                  onChange={e => {
                    setSelectedSymbol(e.target.value);
                    setResult(null);
                  }}
                  className="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-bold text-slate-800 outline-none focus:border-rose-500"
                >
                  {ASSETS.map(a => (
                    <option key={a.symbol} value={a.symbol}>
                      {a.name} Index ({a.symbol})
                    </option>
                  ))}
                </select>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <button
                  type="button"
                  onClick={() => runLiveMarketScan(false, false)}
                  disabled={isScanningMarkets}
                  className="py-3 px-4 rounded-xl bg-rose-500 hover:bg-rose-600 disabled:opacity-70 text-white font-extrabold text-xs sm:text-sm cursor-pointer"
                >
                  {isScanningMarkets
                    ? `SCANNING ${scanProgress.symbol} (${scanProgress.current}/${scanProgress.total})...`
                    : "SCAN ALL MARKETS"}
                </button>
                <button
                  type="button"
                  onClick={() => runLiveMarketScan(true, false)}
                  disabled={isScanningMarkets}
                  className="py-3 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 disabled:opacity-60 text-white font-extrabold text-xs sm:text-sm cursor-pointer"
                >
                  SCAN &amp; SELECT TOP
                </button>
              </div>

              {scanError && (
                <p className="text-xs font-semibold text-rose-600 bg-rose-50 border border-rose-200 rounded-xl px-3 py-2">
                  {scanError}
                </p>
              )}

              {rankedScanResults.length > 0 && (
                <div className="rounded-xl border border-slate-200 overflow-hidden">
                  <div className="px-3 py-2 bg-slate-100 border-b border-slate-200 flex items-center justify-between text-[11px] font-bold text-slate-600">
                    <span>Max Entropy = 3.322b • χ² &gt; 16.92 (p&lt;0.05)</span>
                    <span>{rankedScanResults.length} markets</span>
                  </div>
                  <div className="divide-y divide-slate-200 max-h-72 overflow-y-auto">
                    {rankedScanResults.map((row, idx) => {
                      const isCurrent = row.symbol === selectedSymbol;
                      return (
                        <div
                          key={row.symbol}
                          className={`px-3 py-2.5 flex items-center justify-between gap-2 text-xs ${
                            isCurrent ? "bg-emerald-50/70" : "bg-white"
                          }`}
                        >
                          <div className="min-w-0">
                            <div className="flex items-center gap-1.5">
                              <span className="font-mono text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100">
                                #{idx + 1}
                              </span>
                              <span className="font-extrabold text-slate-900 truncate">
                                {row.name}
                              </span>
                              <span className="font-mono text-[11px] text-slate-400">
                                ({row.symbol})
                              </span>
                              {row.lastDigit !== null && (
                                <span className="font-mono text-[10px] font-bold px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200">
                                  D:{row.lastDigit}
                                </span>
                              )}
                            </div>
                            {row.error ? (
                              <p className="text-[11px] text-rose-600 mt-0.5">{row.error}</p>
                            ) : (
                              <div className="flex flex-wrap gap-3 mt-1 text-[11px] text-slate-600">
                                <span>
                                  <strong className="text-slate-900">
                                    χ²: {row.chiSquare.toFixed(2)}
                                  </strong>
                                </span>
                                <span>
                                  Entropy:{" "}
                                  <strong className="text-slate-900">
                                    {row.entropy.toFixed(3)}b
                                  </strong>
                                </span>
                                <span>
                                  Top:{" "}
                                  <strong className="font-mono text-indigo-700">
                                    {row.topDigit} ({row.topPct.toFixed(1)}%)
                                  </strong>
                                </span>
                              </div>
                            )}
                          </div>
                          <button
                            type="button"
                            onClick={() => {
                              setSelectedSymbol(row.symbol);
                              setResult(null);
                            }}
                            className={`shrink-0 px-2.5 py-1.5 rounded-lg text-[11px] font-extrabold cursor-pointer ${
                              isCurrent
                                ? "bg-emerald-600 text-white"
                                : "bg-slate-100 hover:bg-slate-200 text-slate-800"
                            }`}
                          >
                            {isCurrent ? "Selected" : "Use"}
                          </button>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </section>

            {/* LIVE SPOT TICKER */}
            <section className="bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 shadow-xs space-y-4">
              <div className="flex items-center justify-between gap-2">
                <div>
                  <p className="text-[10px] font-extrabold uppercase text-slate-400">
                    Live Spot Ticker
                  </p>
                  <h2 className="text-sm font-extrabold text-slate-900">
                    {asset.name} Index ({asset.symbol})
                  </h2>
                </div>
                <span className="px-2.5 py-1 rounded-full text-xs font-extrabold bg-emerald-50 text-emerald-700 border border-emerald-200">
                  LAST DIGIT: {latestTick?.digit ?? "--"}
                </span>
              </div>

              <div className="rounded-xl bg-slate-50 border border-slate-200 py-5 px-4 text-center">
                <div className="text-3xl sm:text-5xl font-black font-mono tracking-tight text-slate-900">
                  <span>{formattedPrefix}</span>
                  <span className="inline-block ml-0.5 px-2 py-0.5 rounded-lg bg-emerald-500/15 text-emerald-600 border border-emerald-500/30">
                    {formattedFinalDigit}
                  </span>
                </div>
                <div className="mt-3 flex justify-center gap-3 text-xs text-slate-500">
                  <span>
                    <strong className="text-slate-800">{ticks.length.toLocaleString()}</strong> ticks
                  </span>
                  <span>•</span>
                  <span>Latency: {latency !== null ? `${latency}ms` : "--"}</span>
                  <span>•</span>
                  <span>App ID: {appId.trim() ? `#${appId.trim()}` : "NOT SET"}</span>
                </div>
              </div>

              <div className="grid grid-cols-10 gap-1.5">
                {Array.from({ length: 10 }).map((_, idx) => {
                  const tick = lastDigits[idx];
                  const isLatest = tick && idx === lastDigits.length - 1;
                  if (!tick) {
                    return (
                      <div
                        key={`e-${idx}`}
                        className="rounded-lg py-2 text-center font-mono text-xs font-bold bg-slate-100 text-slate-400"
                      >
                        -
                      </div>
                    );
                  }
                  return (
                    <div
                      key={`${tick.epoch}-${idx}`}
                      className={`rounded-lg py-2 text-center font-mono text-sm font-black ${
                        isLatest
                          ? "bg-emerald-500 text-white"
                          : tick.digit % 2 === 0
                          ? "bg-emerald-50 text-emerald-700 border border-emerald-200"
                          : "bg-rose-50 text-rose-700 border border-rose-200"
                      }`}
                    >
                      {tick.digit}
                    </div>
                  );
                })}
              </div>
            </section>

            {/* CONTRACT & ANALYSIS CONTROLS */}
            <section className="bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 shadow-xs space-y-4">
              <div className="flex items-center justify-between">
                <span className="text-xs font-extrabold uppercase text-slate-700">
                  Duration (Ticks)
                </span>
                <div className="flex gap-1.5">
                  {[1, 2, 3, 4, 5].map(n => (
                    <button
                      key={n}
                      type="button"
                      onClick={() => setDuration(n)}
                      className={`w-8 h-8 rounded-lg text-xs font-black border cursor-pointer ${
                        duration === n
                          ? "bg-emerald-600 text-white border-emerald-600"
                          : "bg-slate-50 text-slate-700 border-slate-200"
                      }`}
                    >
                      {n}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                {[
                  { id: "matches_differs", label: "Matches/Differs" },
                  { id: "even_odd", label: "Even/Odd" },
                  { id: "over_under", label: "Over/Under" },
                  { id: "rise_fall", label: "Rise/Fall" }
                ].map(c => (
                  <button
                    key={c.id}
                    type="button"
                    onClick={() => {
                      setContractType(c.id);
                      if (c.id === "matches_differs") setSubMode("MATCHES");
                      if (c.id === "even_odd") setSubMode("EVEN");
                      if (c.id === "over_under") setSubMode("OVER");
                      setResult(null);
                    }}
                    className={`py-2 px-2.5 rounded-xl text-xs font-extrabold border cursor-pointer ${
                      contractType === c.id
                        ? "bg-indigo-600 text-white border-indigo-600"
                        : "bg-slate-50 text-slate-700 border-slate-200"
                    }`}
                  >
                    {c.label}
                  </button>
                ))}
              </div>

              {contractType === "matches_differs" && (
                <div className="flex gap-2">
                  {["MATCHES", "DIFFERS"].map(m => (
                    <button
                      key={m}
                      type="button"
                      onClick={() => {
                        setSubMode(m);
                        setResult(null);
                      }}
                      className={`flex-1 py-2 rounded-lg text-xs font-extrabold border cursor-pointer ${
                        subMode === m
                          ? "bg-slate-900 text-white border-slate-900"
                          : "bg-white text-slate-600 border-slate-200"
                      }`}
                    >
                      {m}
                    </button>
                  ))}
                </div>
              )}

              {contractType === "even_odd" && (
                <div className="flex gap-2">
                  {["EVEN", "ODD"].map(m => (
                    <button
                      key={m}
                      type="button"
                      onClick={() => {
                        setSubMode(m);
                        setResult(null);
                      }}
                      className={`flex-1 py-2 rounded-lg text-xs font-extrabold border cursor-pointer ${
                        subMode === m
                          ? "bg-slate-900 text-white border-slate-900"
                          : "bg-white text-slate-600 border-slate-200"
                      }`}
                    >
                      {m}
                    </button>
                  ))}
                </div>
              )}

              {contractType === "over_under" && (
                <div className="space-y-2">
                  <div className="flex gap-2">
                    {["OVER", "UNDER"].map(m => (
                      <button
                        key={m}
                        type="button"
                        onClick={() => {
                          setSubMode(m);
                          setResult(null);
                        }}
                        className={`flex-1 py-2 rounded-lg text-xs font-extrabold border cursor-pointer ${
                          subMode === m
                            ? "bg-slate-900 text-white border-slate-900"
                            : "bg-white text-slate-600 border-slate-200"
                        }`}
                      >
                        {m}
                      </button>
                    ))}
                  </div>
                  <div className="bg-slate-50 rounded-xl p-3 border border-slate-200">
                    <div className="flex justify-between text-xs font-bold mb-1">
                      <span>Barrier Digit</span>
                      <span className="font-mono text-indigo-700">{barrier}</span>
                    </div>
                    <input
                      type="range"
                      min="0"
                      max="9"
                      value={barrier}
                      onChange={e => {
                        setBarrier(Number(e.target.value));
                        setResult(null);
                      }}
                      className="w-full accent-indigo-600 cursor-pointer"
                    />
                  </div>
                </div>
              )}

              <button
                type="button"
                onClick={executeAnalysis}
                disabled={status !== "LIVE" || ticks.length < MIN_ANALYSIS_TICKS || isProcessingAnalysis}
                className="w-full py-3.5 px-5 rounded-xl bg-emerald-500 hover:bg-emerald-600 disabled:bg-slate-200 disabled:text-slate-400 text-white font-black text-sm cursor-pointer"
              >
                {isProcessingAnalysis
                  ? `ANALYZING (${analysisProgress}%)...`
                  : ticks.length < MIN_ANALYSIS_TICKS
                  ? `NEED ${MIN_ANALYSIS_TICKS - ticks.length} MORE TICKS`
                  : "EXECUTE ANALYSIS"}
              </button>
            </section>

            {/* RESULT CARD */}
            {result && !result.error && !isProcessingAnalysis && (
              <section className="bg-white border-2 border-emerald-500/40 rounded-2xl p-4 sm:p-5 shadow-md space-y-4">
                <div className="rounded-2xl bg-slate-900 text-white p-5 text-center space-y-2">
                  <span className="text-[10px] font-extrabold uppercase tracking-widest px-3 py-1 rounded-full bg-white/10 text-slate-300">
                    MODEL OUTPUT • {result.badgeLabel}
                  </span>
                  <div className="text-4xl sm:text-5xl font-black text-amber-400">
                    {result.primaryDisplay}
                  </div>
                  <p className="text-sm font-semibold text-slate-200">{result.headline}</p>
                  {result.probability !== null ? (
                    <span className="inline-block px-3 py-1 rounded-full text-sm font-black bg-emerald-500/20 text-emerald-400">
                      {result.probability.toFixed(2)}%
                    </span>
                  ) : (
                    <span className="inline-block px-3 py-1 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300">
                      Indicator only (no probability)
                    </span>
                  )}
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  <div className="bg-slate-50 border border-slate-200 rounded-xl p-3">
                    <p className="text-[10px] font-bold uppercase text-slate-500">Chi-Square</p>
                    <p className="text-base font-black text-slate-900">{result.chiSquare.toFixed(2)}</p>
                  </div>
                  <div className="bg-slate-50 border border-slate-200 rounded-xl p-3">
                    <p className="text-[10px] font-bold uppercase text-slate-500">Entropy</p>
                    <p className="text-base font-black text-slate-900">{result.entropy.toFixed(3)}b</p>
                  </div>
                  <div className="bg-slate-50 border border-slate-200 rounded-xl p-3">
                    <p className="text-[10px] font-bold uppercase text-slate-500">Markov Obs</p>
                    <p className="text-base font-black text-slate-900">{result.transitionObservations}</p>
                  </div>
                  <div className="bg-slate-50 border border-slate-200 rounded-xl p-3">
                    <p className="text-[10px] font-bold uppercase text-slate-500">Samples</p>
                    <p className="text-base font-black text-slate-900">{result.sampleSize}</p>
                  </div>
                </div>

                <button
                  type="button"
                  onClick={copyResult}
                  className="w-full py-2.5 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs sm:text-sm font-bold cursor-pointer"
                >
                  {copied ? "Copied to Clipboard" : "Copy Analysis Summary"}
                </button>
              </section>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
