<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Quantitative & Statistical Market Terminal</title>
    <style>
        :root {
            --bg-base: #0b0e14;
            --bg-card: #121824;
            --bg-input: #1a2233;
            --border-color: #2a364f;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-green: #2ea043;
            --accent-red: #da3633;
            --accent-blue: #58a6ff;
            --accent-purple: #bc8cff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-disconnected { background: rgba(218, 54, 51, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .status-connected { background: rgba(46, 160, 67, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }

        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background: var(--bg-card);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        select, input, button {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        select:focus, input:focus {
            border-color: var(--accent-blue);
        }

        button {
            background: var(--accent-blue);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
        }

        button:hover {
            background: #388bfd;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--accent-purple);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .metric-box {
            background: var(--bg-input);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .metric-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .metric-value {
            font-size: 1.4rem;
            font-weight: bold;
            margin-top: 4px;
        }

        .price-display {
            font-size: 2.2rem;
            font-weight: 700;
            font-family: monospace;
            margin-bottom: 10px;
        }

        .tick-up { color: var(--accent-green); }
        .tick-down { color: var(--accent-red); }

        .digits-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .digit-box {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            text-align: center;
            padding: 8px;
            border-radius: 6px;
        }

        .digit-number {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .digit-percentage {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .log-box {
            background: #06080c;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            height: 180px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .log-entry {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Deriv Quant & Statistical Analysis Terminal</h1>
        <div id="connectionStatus" class="status-badge status-disconnected">Disconnected</div>
    </header>

    <div class="control-panel">
        <div class="control-group">
            <label for="symbolSelect">Market Symbol</label>
            <select id="symbolSelect">
                <option value="R_100">Volatility 100 Index</option>
                <option value="R_75">Volatility 75 Index</option>
                <option value="R_50">Volatility 50 Index</option>
                <option value="R_25">Volatility 25 Index</option>
                <option value="R_10">Volatility 10 Index</option>
                <option value="1HZ10V">Volatility 10 (1s) Index</option>
                <option value="1HZ100V">Volatility 100 (1s) Index</option>
                <option value="frxEURUSD">EUR/USD</option>
            </select>
        </div>
        <div class="control-group">
            <label for="windowSelect">Rolling Window (Ticks)</label>
            <select id="windowSelect">
                <option value="25">25 Ticks</option>
                <option value="50">50 Ticks</option>
                <option value="100" selected>100 Ticks</option>
                <option value="200">200 Ticks</option>
                <option value="500">500 Ticks</option>
            </select>
        </div>
        <div class="control-group">
            <label for="appIdInput">Deriv App ID</label>
            <input type="text" id="appIdInput" value="1089">
        </div>
        <div class="control-group" style="justify-content: flex-end;">
            <button id="connectBtn">Connect & Stream</button>
        </div>
    </div>

    <div class="dashboard-grid">
        <div>
            <div class="card">
                <h2>Real-Time Price & Momentum</h2>
                <div id="priceDisplay" class="price-display">0.00000</div>
                <div class="metrics-grid">
                    <div class="metric-box">
                        <div class="metric-title">Markov P(Up | Prev Up)</div>
                        <div id="markovUp" class="metric-value">0.00%</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-title">Markov P(Down | Prev Down)</div>
                        <div id="markovDown" class="metric-value">0.00%</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-title">Bayesian Posterior (Bullish)</div>
                        <div id="bayesianBull" class="metric-value">50.0%</div>
                    </div>
                    <div class="metric-box">
                        <div class="metric-title">Active Sample Count</div>
                        <div id="sampleCount" class="metric-value">0</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Last Digit Frequency Distribution</h2>
                <div class="digits-container" id="digitsContainer">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>

        <div>
            <div class="card">
                <h2>Terminal Diagnostics Log</h2>
                <div id="logBox" class="log-box"></div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let tickHistory = [];
        let maxWindow = 100;

        const statusBadge = document.getElementById('connectionStatus');
        const connectBtn = document.getElementById('connectBtn');
        const symbolSelect = document.getElementById('symbolSelect');
        const windowSelect = document.getElementById('windowSelect');
        const appIdInput = document.getElementById('appIdInput');
        const priceDisplay = document.getElementById('priceDisplay');
        const logBox = document.getElementById('logBox');
        const sampleCountElem = document.getElementById('sampleCount');
        const markovUpElem = document.getElementById('markovUp');
        const markovDownElem = document.getElementById('markovDown');
        const bayesianBullElem = document.getElementById('bayesianBull');
        const digitsContainer = document.getElementById('digitsContainer');

        // Initialize empty digit boxes
        function initDigitBoxes() {
            digitsContainer.innerHTML = '';
            for (let i = 0; i <= 9; i++) {
                digitsContainer.innerHTML += `
                    <div class="digit-box">
                        <div class="digit-number">${i}</div>
                        <div class="digit-percentage" id="dig-${i}">0.0%</div>
                    </div>
                `;
            }
        }
        initDigitBoxes();

        function logMessage(msg) {
            const timeStr = new Date().toLocaleTimeString();
            logBox.innerHTML += `<div class="log-entry">[${timeStr}] ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        connectBtn.addEventListener('click', () => {
            if (ws) {
                ws.close();
            }

            maxWindow = parseInt(windowSelect.value);
            const appId = appIdInput.value.trim() || '1089';
            const symbol = symbolSelect.value;

            logMessage(`Connecting to Deriv WebSocket (App ID: ${appId})...`);
            ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${appId}`);

            ws.onopen = () => {
                statusBadge.textContent = 'Connected';
                statusBadge.className = 'status-badge status-connected';
                logMessage('WebSocket connected successfully.');

                // Request initial history and subscribe
                const req = {
                    ticks_history: symbol,
                    end: 'latest',
                    count: maxWindow,
                    style: 'ticks',
                    subscribe: 1
                };
                ws.send(JSON.stringify(req));
                logMessage(`Requested tick history for ${symbol}`);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.msg_type === 'history') {
                    const prices = data.history.prices;
                    tickHistory = prices.map(p => parseFloat(p));
                    logMessage(`Loaded ${tickHistory.length} historical ticks.`);
                    updateCalculations();
                } else if (data.msg_type === 'tick') {
                    const newPrice = parseFloat(data.tick.quote);
                    const prevPrice = tickHistory[tickHistory.length - 1];

                    tickHistory.push(newPrice);
                    if (tickHistory.length > maxWindow) {
                        tickHistory.shift();
                    }

                    // Render Price update
                    priceDisplay.textContent = newPrice.toFixed(data.pip_size || 4);
                    if (prevPrice) {
                        priceDisplay.className = `price-display ${newPrice >= prevPrice ? 'tick-up' : 'tick-down'}`;
                    }

                    updateCalculations();
                }
            };

            ws.onerror = (error) => {
                logMessage(`WebSocket Error: ${error.message || 'Connection failure'}`);
            };

            ws.onclose = () => {
                statusBadge.textContent = 'Disconnected';
                statusBadge.className = 'status-badge status-disconnected';
                logMessage('WebSocket connection closed.');
            };
        });

        windowSelect.addEventListener('change', () => {
            maxWindow = parseInt(windowSelect.value);
            if (tickHistory.length > maxWindow) {
                tickHistory = tickHistory.slice(tickHistory.length - maxWindow);
            }
            updateCalculations();
        });

        symbolSelect.addEventListener('change', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                connectBtn.click(); // Reconnect with new symbol
            }
        });

        function updateCalculations() {
            const n = tickHistory.length;
            sampleCountElem.textContent = n;
            if (n < 5) return;

            // 1. Calculate Price Diffs & Directional States (+1 for Up, -1 for Down/Equal)
            let diffs = [];
            let upToUp = 0, upTotal = 0;
            let downToDown = 0, downTotal = 0;

            for (let i = 1; i < n; i++) {
                const diff = tickHistory[i] - tickHistory[i-1];
                const direction = diff >= 0 ? 1 : -1;
                diffs.push(direction);

                if (i > 1) {
                    const prevDir = diffs[i-2];
                    if (prevDir === 1) {
                        upTotal++;
                        if (direction === 1) upToUp++;
                    } else {
                        downTotal++;
                        if (direction === -1) downToDown++;
                    }
                }
            }

            // Markov Probabilities
            const mUpProb = upTotal > 0 ? (upToUp / upTotal) * 100 : 50;
            const mDownProb = downTotal > 0 ? (downToDown / downTotal) * 100 : 50;

            markovUpElem.textContent = mUpProb.toFixed(1) + '%';
            markovDownElem.textContent = mDownProb.toFixed(1) + '%';

            // 2. Bayesian Updating (Prior = 50%, Likelihood based on recent momentum window)
            const recentSlice = diffs.slice(-10);
            const recentBullishCount = recentSlice.filter(d => d === 1).length;
            const likelihood = recentBullishCount / recentSlice.length;
            const prior = 0.5;
            // Simplified Beta-Binomial / Bayesian Update
            const posterior = (likelihood * prior) / ((likelihood * prior) + ((1 - likelihood) * (1 - prior)));
            bayesianBullElem.textContent = (posterior * 100).toFixed(1) + '%';

            // 3. Last Digit Frequency Analysis
            let digitCounts = new Array(10).fill(0);
            tickHistory.forEach(price => {
                const strPrice = price.toString();
                const lastChar = strPrice.slice(-1);
                const digit = parseInt(lastChar);
                if (!isNaN(digit)) {
                    digitCounts[digit]++;
                }
            });

            for (let i = 0; i <= 9; i++) {
                const pct = n > 0 ? (digitCounts[i] / n) * 100 : 0;
                const elem = document.getElementById(`dig-${i}`);
                if (elem) {
                    elem.textContent = pct.toFixed(1) + '%';
                }
            }
        }
    </script>
</body>
</html>
